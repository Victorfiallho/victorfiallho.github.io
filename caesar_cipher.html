<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caesar Cipher Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&family=Fraunces:opsz,wght@9..144,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #080808;
      --white: #f0ede6;
      --accent: #c8ff00;
      --accent-dim: #a3d000;
      --muted: #555450;
      --border: rgba(240,237,230,0.1);
      --card-bg: #111110;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: 'DM Mono', monospace;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.5;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(320px, 1.2fr);
      gap: clamp(2rem, 6vw, 6rem);
      align-items: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      position: relative;
    }

    .bg-word {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Syne', sans-serif;
      font-size: clamp(72px, 16vw, 240px);
      font-weight: 800;
      color: transparent;
      -webkit-text-stroke: 1px rgba(240,237,230,0.035);
      letter-spacing: -0.03em;
      white-space: nowrap;
      pointer-events: none;
    }

    .intro, .panel { position: relative; z-index: 1; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: '';
      width: 24px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(42px, 7vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .intro p {
      max-width: 440px;
      font-family: 'Fraunces', serif;
      font-size: 1.05rem;
      line-height: 1.75;
      color: rgba(240,237,230,0.62);
      font-weight: 300;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-top: 2rem;
      border: 1px solid var(--border);
      background: var(--border);
      max-width: 440px;
    }

    .stat {
      background: var(--black);
      padding: 1rem;
    }

    .stat-value {
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
    }

    .stat-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .panel {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: clamp(1.25rem, 3vw, 2rem) 0;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.55rem;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    textarea, output {
      display: block;
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--white);
      font: inherit;
      line-height: 1.7;
      padding: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: rgba(200,255,0,0.38);
    }

    output {
      white-space: pre-wrap;
      color: rgba(240,237,230,0.76);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: end;
      margin: 1rem 0;
    }

    .shift-control {
      display: grid;
      grid-template-columns: 1fr 64px;
      gap: 0.75rem;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"] {
      width: 64px;
      border: 1px solid var(--border);
      background: var(--black);
      color: var(--accent);
      font: inherit;
      padding: 0.65rem 0.5rem;
      text-align: center;
      outline: none;
    }

    .mode-toggle {
      display: flex;
      border: 1px solid rgba(200,255,0,0.25);
      background: rgba(200,255,0,0.04);
    }

    button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.8rem 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    button.active {
      background: var(--accent);
      color: var(--black);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .ghost-button {
      border: 1px solid rgba(200,255,0,0.25);
      color: var(--accent);
      background: rgba(200,255,0,0.06);
    }

    .ghost-button:hover {
      background: var(--accent);
      color: var(--black);
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .mode-toggle {
        width: max-content;
      }
    }
  </style>
</head>
<body>
  <div class="bg-word" aria-hidden="true">CIPHER</div>
  <main>
    <section class="intro">
      <div class="eyebrow">Cryptography Tool</div>
      <h1>Caesar<br>Cipher</h1>
      <p>
        A small interactive lab for one of the oldest substitution ciphers: shift each letter through the alphabet, preserve spacing, and decode it back with the same offset.
      </p>
      <div class="stats" aria-label="Cipher details">
        <div class="stat">
          <div class="stat-value">26</div>
          <div class="stat-label">Letters</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="shiftStat">3</div>
          <div class="stat-label">Shift</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="modeStat">ENC</div>
          <div class="stat-label">Mode</div>
        </div>
      </div>
    </section>

    <section class="panel" aria-label="Caesar cipher generator">
      <div class="field">
        <label for="plainText">Input</label>
        <textarea id="plainText" spellcheck="false">Victor builds AI systems in Brasilia.</textarea>
      </div>

      <div class="controls">
        <div>
          <label for="shiftRange">Shift</label>
          <div class="shift-control">
            <input id="shiftRange" type="range" min="0" max="25" value="3">
            <input id="shiftNumber" type="number" min="0" max="25" value="3">
          </div>
        </div>
        <div>
          <label>Mode</label>
          <div class="mode-toggle" aria-label="Cipher mode">
            <button class="active" id="encryptButton" type="button">Encrypt</button>
            <button id="decryptButton" type="button">Decrypt</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="cipherOutput">Output</label>
        <output id="cipherOutput"></output>
      </div>

      <div class="actions">
        <button class="ghost-button" id="swapButton" type="button">Use Output</button>
        <button class="ghost-button" id="clearButton" type="button">Clear</button>
      </div>
    </section>
  </main>

  <script>
    const plainText = document.getElementById('plainText');
    const cipherOutput = document.getElementById('cipherOutput');
    const shiftRange = document.getElementById('shiftRange');
    const shiftNumber = document.getElementById('shiftNumber');
    const encryptButton = document.getElementById('encryptButton');
    const decryptButton = document.getElementById('decryptButton');
    const swapButton = document.getElementById('swapButton');
    const clearButton = document.getElementById('clearButton');
    const shiftStat = document.getElementById('shiftStat');
    const modeStat = document.getElementById('modeStat');

    let mode = 'encrypt';

    function shiftCharacter(char, shift) {
      const code = char.charCodeAt(0);
      const isUpper = code >= 65 && code <= 90;
      const isLower = code >= 97 && code <= 122;

      if (!isUpper && !isLower) return char;

      const base = isUpper ? 65 : 97;
      const normalized = code - base;
      const shifted = (normalized + shift + 26) % 26;
      return String.fromCharCode(base + shifted);
    }

    function transformText() {
      const shift = Number(shiftRange.value);
      const direction = mode === 'encrypt' ? shift : -shift;
      const result = [...plainText.value].map(char => shiftCharacter(char, direction)).join('');

      cipherOutput.textContent = result;
      shiftStat.textContent = shift;
      modeStat.textContent = mode === 'encrypt' ? 'ENC' : 'DEC';
    }

    function syncShift(value) {
      const safeValue = Math.max(0, Math.min(25, Number(value) || 0));
      shiftRange.value = safeValue;
      shiftNumber.value = safeValue;
      transformText();
    }

    function setMode(nextMode) {
      mode = nextMode;
      encryptButton.classList.toggle('active', mode === 'encrypt');
      decryptButton.classList.toggle('active', mode === 'decrypt');
      transformText();
    }

    plainText.addEventListener('input', transformText);
    shiftRange.addEventListener('input', event => syncShift(event.target.value));
    shiftNumber.addEventListener('input', event => syncShift(event.target.value));
    encryptButton.addEventListener('click', () => setMode('encrypt'));
    decryptButton.addEventListener('click', () => setMode('decrypt'));
    swapButton.addEventListener('click', () => {
      plainText.value = cipherOutput.textContent;
      transformText();
    });
    clearButton.addEventListener('click', () => {
      plainText.value = '';
      transformText();
      plainText.focus();
    });

    transformText();
  </script>
</body>
</html>
