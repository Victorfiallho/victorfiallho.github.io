<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Sort Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&family=Fraunces:opsz,wght@9..144,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #080808;
      --white: #f0ede6;
      --accent: #c8ff00;
      --accent-dim: #a3d000;
      --muted: #555450;
      --border: rgba(240,237,230,0.1);
      --card-bg: #111110;
      --compare: #ff4d4d;
      --sorted: #6bff9a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: 'DM Mono', monospace;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.5;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(320px, 1.2fr);
      gap: clamp(2rem, 6vw, 6rem);
      align-items: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      position: relative;
    }

    .bg-word {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Syne', sans-serif;
      font-size: clamp(72px, 17vw, 260px);
      font-weight: 800;
      color: transparent;
      -webkit-text-stroke: 1px rgba(240,237,230,0.035);
      letter-spacing: -0.03em;
      white-space: nowrap;
      pointer-events: none;
    }

    .intro {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: '';
      width: 24px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(42px, 7vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .intro p {
      max-width: 440px;
      font-family: 'Fraunces', serif;
      font-size: 1.05rem;
      line-height: 1.75;
      color: rgba(240,237,230,0.62);
      font-weight: 300;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-top: 2rem;
      border: 1px solid var(--border);
      background: var(--border);
      max-width: 440px;
    }

    .stat {
      background: var(--black);
      padding: 1rem;
      min-width: 0;
    }

    .stat-value {
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
    }

    .stat-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .panel {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: clamp(1.25rem, 3vw, 2rem) 0;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .status {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    button {
      border: 1px solid rgba(200,255,0,0.25);
      background: rgba(200,255,0,0.06);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.7rem 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--black);
    }

    button:disabled {
      border-color: var(--border);
      color: var(--muted);
      background: transparent;
      cursor: not-allowed;
    }

    .stage {
      position: relative;
      height: min(52vh, 430px);
      min-height: 300px;
      border: 1px solid var(--border);
      background:
        linear-gradient(rgba(240,237,230,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,237,230,0.03) 1px, transparent 1px),
        var(--card-bg);
      background-size: 100% 25%, 8.333% 100%, auto;
      overflow: hidden;
    }

    .bar {
      position: absolute;
      bottom: 0;
      min-width: 10px;
      background: linear-gradient(to top, var(--accent-dim), var(--accent));
      border-top: 1px solid rgba(240,237,230,0.35);
      box-shadow: 0 0 18px rgba(200,255,0,0.08);
      transition: left 0.28s cubic-bezier(0.16,1,0.3,1), height 0.28s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .bar.compare {
      background: linear-gradient(to top, #b81f1f, var(--compare));
      box-shadow: 0 0 24px rgba(255,77,77,0.2);
    }

    .bar.sorted {
      background: linear-gradient(to top, #3ac765, var(--sorted));
      box-shadow: 0 0 24px rgba(107,255,154,0.14);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .swatch {
      width: 8px;
      height: 8px;
      background: var(--accent);
    }

    .swatch.compare { background: var(--compare); }
    .swatch.sorted { background: var(--sorted); }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        justify-content: flex-start;
      }

      .stage {
        min-height: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-word" aria-hidden="true">SORT</div>
  <main>
    <section class="intro">
      <div class="eyebrow">Algorithm Visualizer</div>
      <h1>Bubble<br>Sort</h1>
      <p>
        A focused visualization of adjacent comparisons, swaps, and sorted passes. Each red pair is being compared; each green bar is locked into place.
      </p>
      <div class="stats" aria-label="Sorting metrics">
        <div class="stat">
          <div class="stat-value" id="comparisonCount">0</div>
          <div class="stat-label">Comparisons</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="swapCount">0</div>
          <div class="stat-label">Swaps</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="passCount">0</div>
          <div class="stat-label">Passes</div>
        </div>
      </div>
    </section>

    <section class="panel" aria-label="Bubble sort animation">
      <div class="toolbar">
        <div class="status" id="statusText">Ready</div>
        <div class="controls">
          <button id="shuffleButton" type="button">Shuffle</button>
          <button id="startButton" type="button">Start</button>
        </div>
      </div>
      <div class="stage" id="sortContainer"></div>
      <div class="legend" aria-hidden="true">
        <span><i class="swatch"></i>Unsorted</span>
        <span><i class="swatch compare"></i>Comparing</span>
        <span><i class="swatch sorted"></i>Sorted</span>
      </div>
    </section>
  </main>

  <script>
    const translations = {
      en: {
        title: 'Bubble Sort Demo',
        bgWord: 'SORT',
        eyebrow: 'Algorithm Visualizer',
        heading: 'Bubble<br>Sort',
        description: 'A focused visualization of adjacent comparisons, swaps, and sorted passes. Each red pair is being compared; each green bar is locked into place.',
        statsLabel: 'Sorting metrics',
        statLabels: ['Comparisons', 'Swaps', 'Passes'],
        panelLabel: 'Bubble sort animation',
        statusReady: 'Ready',
        statusSorting: 'Sorting',
        statusSorted: 'Sorted',
        shuffle: 'Shuffle',
        start: 'Start',
        legend: ['Unsorted', 'Comparing', 'Sorted'],
        valueLabel: 'Value'
      },
      pt: {
        title: 'Demo de Bubble Sort',
        bgWord: 'ORDENAR',
        eyebrow: 'Visualizador de Algoritmo',
        heading: 'Bubble<br>Sort',
        description: 'Uma visualizacao focada em comparacoes adjacentes, trocas e passagens ordenadas. Cada par vermelho esta sendo comparado; cada barra verde ja esta travada no lugar.',
        statsLabel: 'Metricas da ordenacao',
        statLabels: ['Comparacoes', 'Trocas', 'Passagens'],
        panelLabel: 'Animacao do bubble sort',
        statusReady: 'Pronto',
        statusSorting: 'Ordenando',
        statusSorted: 'Ordenado',
        shuffle: 'Embaralhar',
        start: 'Iniciar',
        legend: ['Nao ordenado', 'Comparando', 'Ordenado'],
        valueLabel: 'Valor'
      }
    };

    const params = new URLSearchParams(window.location.search);
    const requestedLang = params.get('lang');
    const browserLang = navigator.language || navigator.userLanguage || 'en';
    const langKey = requestedLang === 'pt' || requestedLang === 'en'
      ? requestedLang
      : browserLang.toLowerCase().startsWith('pt') ? 'pt' : 'en';
    const text = translations[langKey];

    function applyLanguage() {
      document.documentElement.lang = langKey === 'pt' ? 'pt-BR' : 'en';
      document.title = text.title;
      document.querySelector('.bg-word').textContent = text.bgWord;
      document.querySelector('.eyebrow').textContent = text.eyebrow;
      document.querySelector('h1').innerHTML = text.heading;
      document.querySelector('.intro p').textContent = text.description;
      document.querySelector('.stats').setAttribute('aria-label', text.statsLabel);
      document.querySelector('.panel').setAttribute('aria-label', text.panelLabel);
      document.querySelectorAll('.stat-label').forEach((item, index) => item.textContent = text.statLabels[index]);
      shuffleButton.textContent = text.shuffle;
      startButton.textContent = text.start;
      document.querySelectorAll('.legend span').forEach((item, index) => {
        const swatchClass = index === 1 ? ' compare' : index === 2 ? ' sorted' : '';
        item.innerHTML = `<i class="swatch${swatchClass}"></i>${text.legend[index]}`;
      });
    }

    const container = document.getElementById('sortContainer');
    const startButton = document.getElementById('startButton');
    const shuffleButton = document.getElementById('shuffleButton');
    const statusText = document.getElementById('statusText');
    const comparisonCount = document.getElementById('comparisonCount');
    const swapCount = document.getElementById('swapCount');
    const passCount = document.getElementById('passCount');

    const numBars = 12;
    const delay = 320;
    let array = [];
    let bars = [];
    let isSorting = false;
    let comparisons = 0;
    let swaps = 0;
    let passes = 0;

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function updateStats() {
      comparisonCount.textContent = comparisons;
      swapCount.textContent = swaps;
      passCount.textContent = passes;
    }

    function initializeArray() {
      array = Array.from({ length: numBars }, () => Math.floor(Math.random() * 78) + 22);
      comparisons = 0;
      swaps = 0;
      passes = 0;
      updateStats();
    }

    function createBars() {
      container.innerHTML = '';
      bars = [];

      const stageWidth = container.clientWidth;
      const gap = Math.max(4, stageWidth * 0.01);
      const barWidth = (stageWidth - gap * (numBars + 1)) / numBars;
      const maxValue = Math.max(...array);

      array.forEach((value, index) => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.title = `${text.valueLabel}: ${value}`;
        bar.style.width = `${barWidth}px`;
        bar.style.height = `${(value / maxValue) * 88}%`;
        bar.style.left = `${gap + index * (barWidth + gap)}px`;
        container.appendChild(bar);
        bars.push(bar);
      });
    }

    function setControls(disabled) {
      isSorting = disabled;
      startButton.disabled = disabled;
      shuffleButton.disabled = disabled;
    }

    function clearBarStates() {
      bars.forEach(bar => {
        bar.classList.remove('compare', 'sorted');
      });
    }

    async function bubbleSort() {
      if (isSorting) return;

      setControls(true);
      statusText.textContent = text.statusSorting;
      clearBarStates();

      for (let i = 0; i < array.length - 1; i++) {
        let swappedThisPass = false;

        for (let j = 0; j < array.length - i - 1; j++) {
          bars[j].classList.add('compare');
          bars[j + 1].classList.add('compare');
          comparisons++;
          updateStats();
          await sleep(delay);

          if (array[j] > array[j + 1]) {
            [array[j], array[j + 1]] = [array[j + 1], array[j]];

            const bar1 = bars[j];
            const bar2 = bars[j + 1];
            const left1 = bar1.style.left;
            const left2 = bar2.style.left;

            bar1.style.left = left2;
            bar2.style.left = left1;
            [bars[j], bars[j + 1]] = [bars[j + 1], bars[j]];

            swaps++;
            swappedThisPass = true;
            updateStats();
            await sleep(delay);
          }

          bars[j].classList.remove('compare');
          bars[j + 1].classList.remove('compare');
        }

        bars[array.length - 1 - i].classList.add('sorted');
        passes++;
        updateStats();

        if (!swappedThisPass) break;
      }

      bars.forEach(bar => bar.classList.add('sorted'));
      statusText.textContent = text.statusSorted;
      setControls(false);
    }

    function shuffle() {
      if (isSorting) return;
      initializeArray();
      createBars();
      statusText.textContent = text.statusReady;
    }

    startButton.addEventListener('click', bubbleSort);
    shuffleButton.addEventListener('click', shuffle);
    window.addEventListener('resize', createBars);

    applyLanguage();
    shuffle();
  </script>
</body>
</html>
